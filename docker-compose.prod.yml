services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      sync-server:
        condition: service_healthy

  web:
    image: ghcr.io/shehryar/collabmd-web:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - NEXT_PUBLIC_SYNC_URL=${NEXT_PUBLIC_SYNC_URL}
      - SYNC_SERVER_INTERNAL_URL=http://sync-server:4444
      - SYNC_SERVER_INTERNAL_SECRET=${SYNC_SERVER_INTERNAL_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - OPENFGA_URL=http://openfga:8080
      - LOOPS_API_KEY=${LOOPS_API_KEY:-}
      - LOOPS_MAGIC_LINK_TRANSACTIONAL_ID=${LOOPS_MAGIC_LINK_TRANSACTIONAL_ID:-}
      - LOOPS_SHARE_INVITE_TRANSACTIONAL_ID=${LOOPS_SHARE_INVITE_TRANSACTIONAL_ID:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      sync-server:
        condition: service_healthy
      openfga-healthcheck:
        condition: service_healthy

  sync-server:
    image: ghcr.io/shehryar/collabmd-sync-server:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "4444"
    environment:
      - NODE_ENV=production
      - PORT=4444
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_URL=http://web:3000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SYNC_SERVER_INTERNAL_SECRET=${SYNC_SERVER_INTERNAL_SECRET:-}
      - OPENFGA_URL=http://openfga:8080
      - WEBHOOK_TIMEOUT_MS=${WEBHOOK_TIMEOUT_MS:-10000}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4444/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  openfga-db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_USER=${OPENFGA_DB_USER}
      - POSTGRES_PASSWORD=${OPENFGA_DB_PASSWORD}
      - POSTGRES_DB=${OPENFGA_DB_NAME:-openfga}
    volumes:
      - openfga-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENFGA_DB_USER} -d ${OPENFGA_DB_NAME:-openfga}"]
      interval: 5s
      timeout: 3s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    security_opt:
      - no-new-privileges:true
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://${OPENFGA_DB_USER}:${OPENFGA_DB_PASSWORD}@openfga-db:5432/${OPENFGA_DB_NAME:-openfga}?sslmode=disable
    depends_on:
      openfga-db:
        condition: service_healthy

  openfga:
    image: openfga/openfga:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: run
    expose:
      - "8080"
      - "8081"
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://${OPENFGA_DB_USER}:${OPENFGA_DB_PASSWORD}@openfga-db:5432/${OPENFGA_DB_NAME:-openfga}?sslmode=disable
      - OPENFGA_PLAYGROUND_ENABLED=false
    depends_on:
      openfga-db:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully

  openfga-healthcheck:
    image: curlimages/curl:latest
    security_opt:
      - no-new-privileges:true
    depends_on:
      - openfga
    entrypoint: ["sh", "-c", "while true; do sleep 30; done"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://openfga:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  caddy-data:
  caddy-config:
  openfga-data:
